<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數位學習島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="國小學習數位島：選年級、登島練習國語、自然、社會，記錄每一次的學習。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面概念：左邊是一張俯瞰的群島海圖，右邊是像碼頭公告板的航線清單；進島後是一條由上而下的關卡航道。 */
:root {
  --sea: #2f7f9e;
  --sea-deep: #1d5a74;
  --sea-soft: #d8eef3;
  --foam: #f4fbfc;
  --sand: #f2dfb4;
  --ink: #18323d;
  --muted: #5a7480;
  --bg: #eaf5f7;
  --card: #ffffff;
  --line: #c9dee4;
  --coral: #e2604d;   /* 國語 */
  --leaf: #3f9b5c;    /* 自然 */
  --amber: #d99a1e;   /* 社會 */
  --star: #f1b31c;
  --ok: #2e9a5a;
  --bad: #d0453a;
  --ok-bg: #e4f5ea;
  --bad-bg: #fbe7e4;
  --shadow: 0 6px 20px rgba(24, 60, 75, .10);
  --font-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "標楷體", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #3d93b4; --sea-deep: #9fd6ea; --sea-soft: #173847; --foam: #d7eef5; --sand: #c9b384;
    --ink: #e4f1f5; --muted: #9db6c0; --bg: #0f2129; --card: #162d37; --line: #28495a;
    --coral: #f07a66; --leaf: #5dbb7a; --amber: #e8b240; --star: #f6c443;
    --ok: #63c98c; --bad: #f07a6e; --ok-bg: #173c2a; --bad-bg: #432421;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #3d93b4; --sea-deep: #9fd6ea; --sea-soft: #173847; --foam: #d7eef5; --sand: #c9b384;
  --ink: #e4f1f5; --muted: #9db6c0; --bg: #0f2129; --card: #162d37; --line: #28495a;
  --coral: #f07a66; --leaf: #5dbb7a; --amber: #e8b240; --star: #f6c443;
  --ok: #63c98c; --bad: #f07a6e; --ok-bg: #173c2a; --bad-bg: #432421;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
.eyebrow { margin: 0; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
.sub { color: var(--muted); margin: 6px 0 0; }

/* 頂部 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--card); }
.topbar-inner {
  max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.brand svg { width: 36px; height: 36px; }
.topnav { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px;
  font-size: 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--sea); }
.chip.user img { width: 22px; height: 22px; border-radius: 50%; }
.chip.ghost { border-color: transparent; }

main {
  max-width: 1120px; margin: 0 auto;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 首頁 */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.map-wrap { background: var(--sea); border-radius: 24px; overflow: hidden; position: relative; box-shadow: var(--shadow); }
#map { display: block; width: 100%; height: auto; }
.map-hint { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; color: #fff; font-size: 14px; opacity: .85; }
.isle { cursor: pointer; transition: transform .25s ease; transform-box: fill-box; transform-origin: center; }
.isle:hover, .isle:focus-visible { transform: translateY(-6px); outline: none; }
.isle.locked { cursor: default; opacity: .55; }
.isle.locked:hover { transform: none; }
.isle-label { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.wave { animation: drift 7s ease-in-out infinite alternate; }
.wave.w2 { animation-duration: 9s; }
@keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
#boat { transition: transform 1s cubic-bezier(.5, 0, .3, 1); }
.bob { animation: bob 3s ease-in-out infinite; transform-box: fill-box; }
@keyframes bob { 50% { transform: translateY(-4px); } }

.dock { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hello { font-size: 34px; line-height: 1.25; }
.total-stars { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.total-stars b { font-size: 28px; }
.total-stars span:last-child { color: var(--muted); }
.total-stars.small b { font-size: 20px; }
.star-ico { color: var(--star); font-size: 22px; }
.daily {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; text-align: left; cursor: pointer;
  background: var(--sand); color: #3b2c0c; border: none; border-radius: var(--r); padding: 14px 16px; column-gap: 12px;
}
.daily-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.daily-desc { grid-row: 2; font-size: 14px; }
.daily-go { grid-row: 1 / 3; grid-column: 2; align-self: center; background: #3b2c0c; color: #fff8e6; padding: 6px 16px; border-radius: 999px; font-weight: 700; }
.daily.done { opacity: .75; }
.daily.done .daily-go { background: var(--ok); }
.isle-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.isle-row {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-align: left; width: 100%;
}
.isle-row:hover { border-color: var(--c); }
.isle-row .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.isle-row .nm { font-weight: 700; }
.isle-row .pub { color: var(--muted); font-size: 13px; margin-left: 6px; font-weight: 400; }
.bar { height: 6px; background: var(--sea-soft); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar span { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.isle-row .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.empty-grade { background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); }

/* 科目島 */
.subject-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; margin-bottom: 20px; }
.subject-title { flex: 1 1 240px; min-width: 0; }
.subject-title h1 { font-size: 36px; line-height: 1.2; }
.subject-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.back { text-decoration: none; color: var(--muted); font-size: 15px; flex-basis: 100%; }
.back.plain { flex-basis: auto; background: none; border: none; cursor: pointer; padding: 0; }
.btn {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 18px; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--sea); }
.btn.primary { background: var(--c, var(--sea)); border-color: var(--c, var(--sea)); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.units { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.unit {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
}
.unit-no { font-family: var(--font-display); font-size: 15px; color: var(--c); font-weight: 700; }
.unit h3 { margin: 0; font-size: 18px; line-height: 1.4; }
.unit-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.unit-stars { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.unit-stars b { color: var(--star); }
.unit.done { border-color: var(--c); }

/* 作答 */
.quiz-card, .result-card {
  max-width: 720px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow);
}
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.quiz-label { font-weight: 700; color: var(--c); text-align: center; flex: 1; min-width: 0; }
.quiz-count { font-variant-numeric: tabular-nums; color: var(--muted); }
.progress { height: 8px; background: var(--sea-soft); border-radius: 99px; margin: 12px 0 18px; overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: var(--c, var(--sea)); transition: width .3s; }
.q-unit { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.q-text { font-family: var(--font-body); font-size: 21px; line-height: 1.6; font-weight: 700; margin-bottom: 16px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 10px; text-align: left; cursor: pointer;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 17px;
}
.opt .key { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.opt:hover:not(:disabled) { border-color: var(--c, var(--sea)); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
.explain { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--sea-soft); font-size: 15px; }
.explain b.ok { color: var(--ok); }
.explain b.no { color: var(--bad); }
.quiz-foot { display: flex; justify-content: flex-end; margin-top: 16px; min-height: 42px; }

.result-card { text-align: center; }
.score { font-variant-numeric: tabular-nums; margin: 8px 0; }
.score b { font-size: 64px; font-family: var(--font-display); color: var(--c, var(--sea)); }
.score span { font-size: 24px; color: var(--muted); }
.res-msg { font-size: 18px; margin: 0; }
.res-stars { color: var(--muted); margin: 6px 0 16px; }
.res-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.review { text-align: left; margin-top: 22px; display: grid; gap: 10px; }
.review h3 { margin: 0; font-size: 16px; }
.rv { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.rv p { margin: 2px 0; }
.rv .yours { color: var(--bad); }
.rv .ans { color: var(--ok); font-weight: 700; }

/* 紀錄 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.log { width: 100%; border-collapse: collapse; font-size: 15px; }
.log th, .log td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.log th { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.log tr:last-child td { border-bottom: none; }
.log .num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; padding: 1px 10px; border-radius: 99px; color: #fff; background: var(--c); font-size: 13px; }
.empty { color: var(--muted); text-align: center; padding: 24px; }

/* 對話框 */
.sheet { border: none; border-radius: 20px; padding: 0; max-width: min(520px, calc(100vw - 32px)); width: 100%; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.sheet::backdrop { background: rgba(10, 30, 40, .45); }
.sheet-body { padding: 22px; display: grid; gap: 12px; }
.sheet-body h2 { font-size: 26px; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; }
.grade-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grade-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px; cursor: pointer; text-align: left; }
.grade-btn b { display: block; font-size: 16px; }
.grade-btn small { color: var(--muted); }
.grade-btn.ready { border-color: var(--sea); }
.grade-btn.current { background: var(--sea); color: #fff; border-color: var(--sea); }
.grade-btn.current small { color: #e4f4f8; }
.gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; color: #1f1f1f; padding: 10px 18px; font-weight: 500; cursor: pointer; }
.field { display: grid; gap: 4px; }
.field input { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; transition: .3s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 820px) {
  .home-grid { grid-template-columns: minmax(0, 1fr); }
  .hello { font-size: 28px; }
  .subject-title h1 { font-size: 30px; }
  .q-text { font-size: 19px; }
  .quiz-card, .result-card { padding: 16px; }
  .brand span { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* 出題工作室 */
.studio { display: grid; gap: 16px; max-width: 860px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-size: 22px; }
.panel a { color: var(--sea-deep); }
.panel code { background: var(--sea-soft); padding: 1px 6px; border-radius: 6px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.field select, .field textarea { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.field input[type="file"] { padding: 6px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 15px; color: var(--muted); }
.status.bad { color: var(--bad); }
.btn.small { padding: 4px 12px; font-size: 14px; }
.file-btn { display: inline-flex; align-items: center; }
.draft { margin: 0; padding-left: 24px; display: grid; gap: 10px; }
.draft > li { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.dq { min-width: 0; }
.dq-q { margin: 0 0 4px; font-weight: 700; }
.dq-opts { margin: 0 0 4px; padding-left: 22px; list-style: upper-alpha; }
.dq-opts li.ok { color: var(--ok); font-weight: 700; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 13px; background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--bad-bg); color: var(--bad); }
.note a { color: var(--sea-deep); font-weight: 700; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }

/* 注音模式 */
:root { --font-plain: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
html.zy { --font-display: "Bpmf Huninn", "Noto Sans TC", sans-serif; --font-body: "Bpmf Huninn", "Noto Sans TC", sans-serif; }
html.zy body { line-height: 1.85; }
html.zy .no-zy, html.zy .no-zy * { font-family: var(--font-plain) !important; }
.zy-chip[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: #fff; }
html.zy body { font-size: 18px; }
html.zy .q-text { font-size: 25px; }
html.zy .opt { font-size: 20px; }
html.zy .explain { font-size: 17px; }

/* ===== 繽紛動畫版 ===== */
:root { --bg-top: #cdeeff; --bg-bot: #fff3dc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-top: #123545; --bg-bot: #1a2329; } }
:root[data-theme="dark"] { --bg-top: #123545; --bg-bot: #1a2329; }
body { background-color: var(--bg); background-image: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 420px, var(--bg) 70%, var(--bg-bot) 100%); min-height: 100vh; }

/* 地圖動畫 */
.map-wrap { border: 4px solid #fff; box-shadow: 0 10px 30px rgba(20, 90, 130, .25); }
.cloud { animation: cloud 70s linear infinite; }
.cloud.c1 { animation-duration: 95s; }
.cloud.c2 { animation-duration: 120s; }
@keyframes cloud { from { transform: translateX(-140px); } to { transform: translateX(700px); } }
.cloud.c0 { animation-delay: -22s !important; }
.sun circle:first-child { transform-box: fill-box; transform-origin: center; animation: sunpulse 4s ease-in-out infinite; }
@keyframes sunpulse { 50% { transform: scale(1.18); opacity: .8; } }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.15); } }
.route { animation: march 1.4s linear infinite; }
@keyframes march { to { stroke-dashoffset: -24; } }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple 4.5s ease-in-out infinite; }
@keyframes ripple { 50% { transform: scale(1.07); opacity: .75; } }
.bobber { animation: bobber 3.8s ease-in-out infinite; }
@keyframes bobber { 50% { transform: translateY(-5px); } }
.isle.picked { animation: picked .42s ease-out; }
@keyframes picked { 45% { transform: scale(1.12); } 100% { transform: scale(1.04); } }
.floaty { opacity: 0; animation: floaty 4s ease-in infinite; }
@keyframes floaty { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 80% { opacity: .9; } 100% { opacity: 0; transform: translateY(-36px); } }
.flap { transform-box: fill-box; transform-origin: center; animation: flap .32s ease-in-out infinite alternate; }
@keyframes flap { to { transform: scaleX(.3); } }
.flag { transform-box: fill-box; transform-origin: left center; animation: flag 1.1s ease-in-out infinite alternate; }
@keyframes flag { to { transform: skewY(9deg) scaleX(.82); } }
.wing { transform-box: fill-box; transform-origin: center; animation: wing .45s ease-in-out infinite alternate; }
@keyframes wing { to { transform: scaleY(-.5); } }
.fish-jump { opacity: 0; transform-box: fill-box; transform-origin: center; animation: jump 7s ease-in-out infinite; }
.fish.f2 .fish-jump { animation-delay: 3.6s; }
@keyframes jump {
  0%, 70% { opacity: 0; transform: translate(0, 0) rotate(-45deg); }
  72% { opacity: 1; transform: translate(0, 0) rotate(-45deg); }

  var DICT = {}, MAXLEN = 1;
  WORDS.split(/\s+/).forEach(function (tok) {
    if (!tok) return;
    var chars = [], marks = [];
    for (var i = 0; i < tok.length; i++) {
      var c = tok[i];
      if (/[0-9d]/.test(c)) { marks[chars.length - 1] = c; continue; }
      chars.push(c);
    }
    var w = chars.join('');
    DICT[w] = marks;
    if (w.length > MAXLEN) MAXLEN = w.length;
  });
  // 預設讀音就要換掉的字（字型預設 → 改用替代讀音）
  var DEFAULT_ALT = { '都': '1' };
  var VS = function (n) { return String.fromCodePoint(0xE01E0 + n); };

  function annotate(str) {
    if (!str || !/[一-鿿]/.test(str)) return str;
    var out = '', i = 0, n = str.length;
    while (i < n) {
      var c = str[i];
      // 已處理過（後面已有 IVS）就跳過
      if (str.codePointAt(i + 1) >= 0xE0100 && str.codePointAt(i + 1) <= 0xE01EF) { out += c + str.substr(i + 1, 2); i += 3; continue; }
      var matched = false;
      for (var L = Math.min(MAXLEN, n - i); L >= 2; L--) {
        var w = str.substr(i, L);
        var m = DICT[w];
        if (m) {
          for (var k = 0; k < L; k++) {
            out += w[k];
            var mk = m[k];
            if (mk && mk !== 'd') out += VS(+mk);
            else if (!mk && DEFAULT_ALT[w[k]]) out += VS(+DEFAULT_ALT[w[k]]);
          }
          i += L; matched = true; break;
        }
      }
      if (matched) continue;
      if (c === '得') {
        // 得到、獲得、值得……讀ㄉㄜˊ；動詞後的「得」多讀˙ㄉㄜ
        var prev = str[i - 1] || '', next = str[i + 1] || '';
        var de2 = /[到分意獎知勝失逞宜體當罪力救]/.test(next) || /[獲取值難心贏習自不所]/.test(prev);
        out += c + (de2 || !prev || !/[一-鿿]/.test(prev) ? '' : VS(1));
      } else if (c === '地') {
        // 「慢慢地」「開心地」：前面是疊字或形容詞時讀˙ㄉㄜ
        var p1 = str[i - 1] || '', p2 = str[i - 2] || '';
        var nx = str[i + 1] || '';
        var de = (p1 && p1 === p2) || (/[心興真力細聲靜然氣意快]/.test(p1) && !/[方區球面上下底點圖形震理位址主]/.test(nx));
        out += c + (de ? VS(1) : '');
      } else if (DEFAULT_ALT[c]) {
        out += c + VS(+DEFAULT_ALT[c]);
      } else {
        out += c;
      }
      i++;
    }
    return out;
  }

  /* ---------- 套用到畫面 ---------- */
  var on = false;
  var SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1, SELECT: 1, OPTION: 1, CODE: 1, TITLE: 1 };
  function walk(root) {
    if (!on || !root) return;
    var tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        for (var p = n.parentNode; p && p !== root.parentNode; p = p.parentNode) {
          if (SKIP[p.nodeName] || (p.classList && p.classList.contains('no-zy'))) return NodeFilter.FILTER_REJECT;

        return n.__zy === n.nodeValue ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    var list = [], node;
    while ((node = tw.nextNode())) list.push(node);
    list.forEach(function (t) { var v = annotate(t.nodeValue); if (v !== t.nodeValue) t.nodeValue = v; t.__zy = t.nodeValue; });
  }
  var pending = false;
  var observer = new MutationObserver(function () {
    if (!on || pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; walk(document.body); });
  });

  function set(v) {
    on = !!v;
    document.documentElement.classList.toggle('zy', on);
    if (on) { walk(document.body); observer.observe(document.body, { childList: true, subtree: true, characterData: true }); }
    else observer.disconnect();
  }

  /* 考讀音的題目：加了注音會洩漏答案，整題改用一般字型 */
  function revealsAnswer(text) { return /[ㄅ-ㄩˊˇˋ˙]|讀音|怎麼讀|讀作|唸作|念作|注音|拼音/.test(text || ''); }

  window.Zhuyin = { set: set, isOn: function () { return on; }, annotate: annotate, revealsAnswer: revealsAnswer };
})();

    setStatus('stStatus', '讀取 PDF 中…');
    var started = Date.now();
    readB64(file).then(function (b64) {
      setStatus('stStatus', 'AI 正在閱讀試卷並出題，大約需要 1～3 分鐘…');
      return callClaude(key, b64, buildPrompt({ gradeLabel: g.label, subjName: s.name, n: n, level: $('stLevel').value, extra: $('stExtra').value.trim() }), function (chars) {
        setStatus('stStatus', 'AI 出題中…已寫出約 ' + chars + ' 字（' + Math.round((Date.now() - started) / 1000) + ' 秒）');
      });
    }).then(function (r) {
      if (r.stop === 'refusal') throw new Error('AI 拒絕處理這份檔案，請換一份試卷試試');
      var data; try { data = JSON.parse(r.text); } catch (e) { throw new Error(r.stop === 'max_tokens' ? '題目太多，回覆被截斷了，請減少題數再試' : 'AI 回傳的格式無法讀取，請再試一次'); }
      var qs = clean(data.questions);
      if (!qs.length) throw new Error('沒有產生可用的題目，請確認 PDF 內容清楚可讀');
      draft = { grade: gradeKey, subj: subjKey, title: title, source: file.name, qs: qs };
      setStatus('stStatus', '完成！產生 ' + qs.length + ' 題，請在下方檢查。');
      renderDraft();
      $('stDraftPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function (e) {
      var msg = e && e.message ? e.message : String(e);
      if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg = '連不上 AI 服務，請檢查網路（學校網路可能封鎖 api.anthropic.com）';
      setStatus('stStatus', '出題失敗：' + msg, true);
    }).then(function () { busy = false; var b = $('stGo'); if (b) b.disabled = false; });
  }

  /* ---------- 草稿 ---------- */
  function renderDraft() {
    var panel = $('stDraftPanel'); if (!panel) return;
    panel.hidden = !draft;
    if (!draft) return;
    $('stDraft').innerHTML = draft.qs.map(function (q, i) {
      return '<li><div class="dq"><p class="dq-q">' + esc(q[0]) + '</p><ol class="dq-opts">' + q[1].map(function (o, k) {
        return '<li' + (k === q[2] ? ' class="ok"' : '') + '>' + esc(o) + (k === q[2] ? '　✓' : '') + '</li>';
      }).join('') + '</ol><p class="hint">' + esc(q[3]) + '</p></div><button class="btn small" type="button" data-del="' + i + '">刪除</button></li>';
    }).join('');
    $('stDraft').querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function () { draft.qs.splice(+b.dataset.del, 1); if (!draft.qs.length) draft = null; renderDraft(); };
    });
    $('stAdd').textContent = '加入題庫（' + draft.qs.length + ' 題）';
  }
  function addDraft() {
    if (!draft) return;
    var app = A();
    app.addSet({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), grade: draft.grade, subj: draft.subj, title: draft.title, source: draft.source, created: Date.now(), qs: draft.qs });
    var s = app.SUBJECTS.filter(function (x) { return x.key === draft.subj; })[0];
    app.toast('已加入' + s.island + '，記得按「發布到網站」讓學生看到');
    draft = null; renderDraft(); renderSets();
  }

  /* ---------- 題庫清單 ---------- */
  function renderSets() {
    var app = A(), box = $('stSets'); if (!box) return;
    var local = {}; app.localSets().forEach(function (s) { local[s.id] = 1; });
    var sets = app.allSets();
    if (!sets.length) { box.innerHTML = '<p class="hint">還沒有 AI 題庫。上傳一份試卷開始吧！</p>'; return; }
    box.innerHTML = '<div class="table-wrap"><table class="log"><thead><tr><th>年級</th><th>科目</th><th>關卡名稱</th><th class="num">題數</th><th>狀態</th><th></th></tr></thead><tbody>' +
      sets.map(function (s) {
        var g = app.GRADES.filter(function (x) { return x.key === s.grade; })[0], sj = app.SUBJECTS.filter(function (x) { return x.key === s.subj; })[0];
        return '<tr><td>' + (g ? g.short : '') + '</td><td><span class="tag" style="--c:' + (sj ? sj.color : 'var(--sea)') + '">' + (sj ? sj.name : '') + '</span></td><td>' + esc(s.title) + '</td><td class="num">' + s.qs.length + '</td><td>' + (local[s.id] ? '<span class="pill warn">尚未發布</span>' : '<span class="pill">已在網站</span>') + '</td><td><button class="btn small" type="button" data-rm="' + esc(s.id) + '">刪除</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    box.querySelectorAll('[data-rm]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '確定刪除？'; return; }
        app.deleteSet(b.dataset.rm); renderSets(); app.toast('已刪除，按「發布到網站」才會從網站上移除');
      };
    });
  }

  function exportSets() {
    var data = JSON.stringify({ version: 1, updated: Date.now(), sets: A().allSets() }, null, 1);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = 'custom-questions.json';
    document.body.appendChild(a); a.click(); a.remove();
    A().toast('已下載 custom-questions.json');
  }
  function importSets(e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (t) {
      var d = JSON.parse(t); var n = A().importSets(d.sets || []);
      renderSets(); A().toast('匯入 ' + n + ' 個題庫');
    }).catch(function () { A().toast('這不是有效的題庫檔'); });
    e.target.value = '';
  }

  /* ---------- 發布到 GitHub ---------- */
  function b64utf8(str) { var bytes = new TextEncoder().encode(str), bin = ''; for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
  function publish() {
    var app = A(), saved = ghDefaults();
    var owner = $('ghOwner').value.trim(), repo = $('ghRepo').value.trim(), branch = $('ghBranch').value.trim() || 'main';
    var tokenIn = $('ghToken').value.trim();
    var token = tokenIn && tokenIn.indexOf('•') !== 0 ? tokenIn : saved.token;
    if (!owner || !repo || !token) { setStatus('ghStatus', '請填寫 GitHub 帳號、Repo 名稱和權杖', true); return; }
    lsSet(GH_STORE, JSON.stringify({ owner: owner, repo: repo, branch: branch, token: token }));
    $('ghToken').value = '••••••••（已設定）';
    var sets = app.allSets();
    var url = 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contents/custom-questions.json';
    var headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
    $('ghPublish').disabled = true; setStatus('ghStatus', '發布中…');
    fetch(url + '?ref=' + encodeURIComponent(branch), { headers: headers, cache: 'no-store' })
      .then(function (r) { if (r.status === 404) return null; if (!r.ok) throw r; return r.json(); })
      .then(function (cur) {
        var body = { message: '更新 AI 題庫（' + sets.length + ' 個關卡）', branch: branch, content: b64utf8(JSON.stringify({ version: 1, updated: Date.now(), sets: sets }, null, 1)) };
        if (cur && cur.sha) body.sha = cur.sha;
        return fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(body) });
      })
      .then(function (r) { if (!r.ok) throw r; return r.json(); })
      .then(function () {
        app.setRemote(sets); app.markPublished(); renderSets();
        setStatus('ghStatus', '已發布！大約 1 分鐘後，學生重新整理網頁就會看到新題目。');
      })
      .catch(function (r) {
        var st = r && r.status;
        setStatus('ghStatus', '發布失敗：' + (st === 401 ? '權杖不正確或已過期' : st === 403 ? '權杖沒有寫入權限（Contents 要選 Read and write）' : st === 404 ? '找不到這個 repo，請檢查帳號與名稱，以及權杖是否有權限存取它' : st === 409 || st === 422 ? '分支名稱不對或檔案剛被修改，請再按一次' : '請檢查網路後再試') , true);
      })
      .then(function () { var b = $('ghPublish'); if (b) b.disabled = false; });
  }

  window.IslandStudio = { render: render };
})();

</script>
<!-- ===== 主程式 ===== -->
<script>
/* 數位學習島 主程式（純前端，不需要伺服器） */
(function () {
  'use strict';

  /* ---------- 基本資料 ---------- */
  var SUBJECTS = [
    { key: 'chinese', name: '國語', island: '國語島', color: 'var(--coral)' },
    { key: 'science', name: '自然科學', island: '自然島', color: 'var(--leaf)' },
    { key: 'social',  name: '社會', island: '社會島', color: 'var(--amber)' }
  ];
  var NUM = ['一', '二', '三', '四', '五', '六'];
  var GRADES = [];
  for (var g = 1; g <= 6; g++) {
    GRADES.push({ key: 'g' + g + 'a', label: NUM[g - 1] + '年級上學期', short: g + '上' });
    GRADES.push({ key: 'g' + g + 'b', label: NUM[g - 1] + '年級下學期', short: g + '下' });
  }
  var QB = window.QB || {};

  /* 自訂（AI 出題）題庫：本機 + 網站上的 custom-questions.json */
  var CUSTOM_KEY = 'islands.custom';
  var custom = (function () { try { var v = JSON.parse(localStorage.getItem(CUSTOM_KEY)); if (v && v.sets) return v; } catch (e) {} return { sets: [], deleted: [] }; })();
  if (!custom.deleted) custom.deleted = [];
  var remoteSets = [];
  function allSets() {
    var map = {};
    remoteSets.concat(custom.sets).forEach(function (s) { if (s && s.id && custom.deleted.indexOf(s.id) < 0) map[s.id] = s; });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return (a.created || 0) - (b.created || 0); });
  }
  function bank(gradeKey, subjKey) {
    var base = QB[gradeKey + '-' + subjKey] || null;
    var extra = allSets().filter(function (s) { return s.grade === gradeKey && s.subj === subjKey && s.qs && s.qs.length; })
      .map(function (s) { return { id: 'C-' + s.id, title: s.title, ai: true, qs: s.qs }; });
    if (!base && !extra.length) return null;
    return { publisher: base ? base.publisher : '自訂題庫', units: (base ? base.units : []).concat(extra) };
  }
  function gradeReady(gradeKey) { return SUBJECTS.some(function (s) { return bank(gradeKey, s.key); }); }
  function gradeInfo(key) { return GRADES.find(function (x) { return x.key === key; }); }
  function subjInfo(key) { return SUBJECTS.find(function (x) { return x.key === key; }); }

  /* 把題庫整理成有編號的題目 */
  function questionsOf(gradeKey, subjKey, unitId) {
    var b = bank(gradeKey, subjKey); if (!b) return [];
    var out = [];
    b.units.forEach(function (u) {
      if (unitId && u.id !== unitId) return;
      u.qs.forEach(function (q, i) {
        out.push({ id: gradeKey + '-' + subjKey + '-' + u.id + '-' + i, subj: subjKey, unit: u.title, q: q[0], opts: q[1], ans: q[2], ex: q[3] });
      });
    });
    return out;
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

  /* ---------- 學習紀錄（本機 + 雲端） ---------- */
  function blank() { return { grade: null, name: '', stars: {}, wrong: {}, history: [], daily: {} }; }
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 無痕模式等情況 */ } }
  function normalize(p) { var b = blank(); p = p || {}; Object.keys(b).forEach(function (k) { if (p[k] == null) p[k] = b[k]; }); return p; }

  var user = null;            // Firebase 使用者
  var storeKey = 'islands.guest';
  var profile = normalize(lsGet(storeKey));
  var cloud = null;           // { db }
  var saveTimer = null;

  function merge(a, b) {
    a = normalize(a); b = normalize(b);
    var m = blank();
    m.grade = a.grade || b.grade;
    m.name = a.name || b.name;
    m.stars = Object.assign({}, b.stars, a.stars);
    m.wrong = Object.assign({}, b.wrong, a.wrong);
    m.daily = Object.assign({}, b.daily, a.daily);
    var seen = {}; m.history = [];
    a.history.concat(b.history).forEach(function (h) { if (!seen[h.id]) { seen[h.id] = 1; m.history.push(h); } });
    m.history.sort(function (x, y) { return y.t - x.t; });
    m.history = m.history.slice(0, 500);
    return m;
  }
  function save() {
    lsSet(storeKey, profile);
    if (cloud && user) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        cloud.db.collection('users').doc(user.uid).set(Object.assign({}, profile, {
          displayName: user.displayName || '', email: user.email || '', updatedAt: Date.now()
        })).catch(function () { toast('雲端同步失敗，紀錄已先存在這台電腦'); });
      }, 600);
    }
  }

  /* ---------- Firebase（有設定才載入） ---------- */
  var FB_VER = '10.12.2';
  var cfg = window.FIREBASE_CONFIG || {};
  var fbReady = !!(cfg.apiKey && cfg.projectId);

  function loadScript(src) {
    return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function initFirebase() {
    if (!fbReady) { renderUserChip(); return; }
    var base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
    loadScript(base + 'firebase-app-compat.js')
      .then(function () { return Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]); })
      .then(function () {
        firebase.initializeApp(cfg);
        cloud = { db: firebase.firestore(), auth: firebase.auth() };
        cloud.auth.onAuthStateChanged(onAuth);
      })
      .catch(function () { fbReady = false; renderUserChip(); toast('無法連線到 Google 登入服務，先以本機模式使用'); });
  }
  function onAuth(u) {
    user = u;
    if (!u) {
      storeKey = 'islands.guest';
      profile = normalize(lsGet(storeKey));
      renderUserChip(); route(); return;
    }
    storeKey = 'islands.user.' + u.uid;
    var cached = lsGet(storeKey);
    cloud.db.collection('users').doc(u.uid).get().then(function (snap) {
      var remote = snap.exists ? snap.data() : null;
      var guest = lsGet('islands.guest');
      profile = merge(merge(cached, remote), guest);
      if (!profile.name) profile.name = u.displayName || '';
      if (guest && (guest.history || []).length) { lsSet('islands.guest', blank()); toast('已把這台電腦上的紀錄合併到你的帳號'); }
      save(); renderUserChip(); route();
      if (!profile.grade) openGrade();
    }).catch(function () {
      profile = normalize(cached || profile);
      renderUserChip(); route();
      toast('讀取雲端紀錄失敗，請確認 Firestore 規則');
    });
  }
  function signIn() {
    if (!cloud) return;
    var provider = new firebase.auth.GoogleAuthProvider();
    cloud.auth.signInWithPopup(provider).catch(function (e) {
      if (e && e.code === 'auth/unauthorized-domain') toast('這個網址還沒加入 Firebase 授權網域');
      else if (e && e.code !== 'auth/popup-closed-by-user') toast('登入沒有成功，請再試一次');
    });
  }
  function signOut() { if (cloud) cloud.auth.signOut(); }

  /* ---------- 小工具 ---------- */
  var toastTimer;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function show(id) { ['home', 'subject', 'quiz', 'result', 'history', 'studio'].forEach(function (v) { $('view-' + v).hidden = v !== id; }); window.scrollTo(0, 0); }
  function starCount(gradeKey, subjKey, unitId) {
    var qs = questionsOf(gradeKey, subjKey, unitId); var n = 0;
    qs.forEach(function (q) { if (profile.stars[q.id]) n++; });
    return { got: n, max: qs.length };
  }

  /* ---------- 頂部 ---------- */
  function renderUserChip() {
    var chip = $('userChip');
    if (user) {
      chip.innerHTML = (user.photoURL ? '<img src="' + esc(user.photoURL) + '" alt="">' : '') + '<span>' + esc(profile.name || user.displayName || '我的帳號') + '</span>';
    } else {
      chip.innerHTML = fbReady ? '<span>Google 登入</span>' : '<span>' + esc(profile.name || '訪客') + '・本機</span>';
    }
    var gi = gradeInfo(profile.grade);
    $('gradeChip').textContent = gi ? gi.label : '選擇年級';
    applyZhuyin();
  }

  /* ---------- 注音模式 ---------- */
  // 一、二年級預設開啟；按過開關之後，依照使用者的選擇
  function zyPref() { try { return localStorage.getItem('islands.zhuyin'); } catch (e) { return null; } }
  function zyWanted() { var p = zyPref(); if (p === 'on') return true; if (p === 'off') return false; return /^g[12]/.test(profile.grade || ''); }
  function applyZhuyin() {
    if (!window.Zhuyin) return;
    var want = zyWanted();
    if (want !== window.Zhuyin.isOn()) window.Zhuyin.set(want);
    var c = $('zyChip'); c.setAttribute('aria-pressed', want ? 'true' : 'false'); c.textContent = want ? '注音：開' : '注音：關';
  }
  $('zyChip').onclick = function () {
    try { localStorage.setItem('islands.zhuyin', zyWanted() ? 'off' : 'on'); } catch (e) {}
    applyZhuyin();
    toast(zyWanted() ? '已開啟注音' : '已關閉注音');
  };
  function noZy(el, text) { if (el) el.classList.toggle('no-zy', !!(window.Zhuyin && window.Zhuyin.revealsAnswer(text))); }

  /* ---------- 年級選擇 ---------- */
  function openGrade() {
    var grid = $('gradeGrid'); grid.innerHTML = '';
    GRADES.forEach(function (gr) {
      var ready = gradeReady(gr.key);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'grade-btn' + (ready ? ' ready' : '') + (profile.grade === gr.key ? ' current' : '');
      b.innerHTML = '<b>' + gr.label + '</b><small>' + (ready ? '題庫已開放' : '島嶼建造中') + '</small>';
      b.onclick = function () {
        profile.grade = gr.key; save(); $('gradeDlg').close(); renderUserChip();
        toast(ready ? '已加入' + gr.label : gr.label + '的島嶼還在建造中，可以先回五上練習');
        location.hash = '#home'; route();
      };
      grid.appendChild(b);
    });
    if (!$('gradeDlg').open) $('gradeDlg').showModal();
  }

  /* ---------- 帳號視窗 ---------- */
  function openUser() {
    var body = $('userDlgBody'), title = $('userDlgTitle');
    if (user) {
      title.textContent = '我的帳號';
      body.innerHTML = '<p><b>' + esc(user.displayName || '') + '</b><br><span class="hint">' + esc(user.email || '') + '</span></p>' +
        '<div class="field"><label for="nickInput">在島上顯示的名字</label><input id="nickInput" maxlength="16" value="' + esc(profile.name) + '"></div>' +
        '<p class="hint">學習紀錄會自動同步到雲端，換一台電腦登入同一個 Google 帳號也看得到。</p>' +
        '<div><button class="btn" type="button" id="logoutBtn">登出</button></div>';
      $('logoutBtn').onclick = function () { $('userDlg').close(); signOut(); };
    } else if (fbReady) {
      title.textContent = '用 Google 帳號登入';
      body.innerHTML = '<p class="sub">登入後，星星、錯題和學習紀錄會存到你的帳號，在學校或家裡都能接著練習。</p>' +
        '<div><button class="gbtn" type="button" id="gBtn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>使用 Google 帳號登入</button></div>' +
        '<p class="hint">沒有登入也能練習，紀錄會先存在這台電腦，登入時會自動合併。</p>';
      $('gBtn').onclick = function () { $('userDlg').close(); signIn(); };

  var FX_COLORS = ['#ff6f61', '#ffd43b', '#4fb860', '#45c1df', '#b07cff', '#ff8ad8'];
  function confetti(x, y, n, spread) {
    if (reduceMotion()) return;
    var cv = document.createElement('canvas'), dpr = Math.min(window.devicePixelRatio || 1, 2);

    document.body.appendChild(cv);
    var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    var ps = [];

      var a = -Math.PI / 2 + (Math.random() - .5) * spread, v = 5 + Math.random() * 7;
      ps.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 5, h: 4 + Math.random() * 4, c: FX_COLORS[i % FX_COLORS.length] });

      var k = (t - t0) / 1600;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(function (p) {
        p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k * k); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      if (k < 1) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }
  function fx(ok, el) {
    if (!el) return;
    if (!ok) { el.classList.add('shake'); return; }
    var r = el.getBoundingClientRect();
    confetti(r.left + r.width * .2, r.top + r.height / 2, 28, 1.6);
    var star = document.createElement('span'); star.className = 'plus-star'; star.textContent = '+1 ★';
    star.style.left = (r.right - 70) + 'px'; star.style.top = (r.top + window.scrollY - 6) + 'px';
    document.body.appendChild(star); setTimeout(function () { star.remove(); }, 1200);
  }
  function countUp(el, to) {
    if (reduceMotion() || to <= 0) { el.textContent = to; return; }
    var t0 = performance.now(), d = 700;
    (function f(t) { var k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
  }

  $('qNext').onclick = function () { if (quiz.i < quiz.qs.length - 1) { quiz.i++; renderQ(); } else finishQuiz(); };
  $('quitQuiz').onclick = function () { quiz = null; route(); };

  function finishQuiz() {
    var score = quiz.results.filter(function (r) { return r.ok; }).length, total = quiz.qs.length;
    var gk = profile.grade || 'g5a';
    profile.history.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(), grade: gk, subj: quiz.subj, title: quiz.label, score: score, total: total, sec: Math.round((Date.now() - quiz.start) / 1000) });
    profile.history = profile.history.slice(0, 500);
    if (quiz.replay && quiz.replay.type === 'daily') profile.daily[today()] = { score: score, total: total };
    save();
    var v = $('view-result'); v.style.setProperty('--c', colorOf(quiz.subj === 'mix' ? 'social' : quiz.subj));
    $('resLabel').textContent = quiz.label;
    countUp($('resScore'), score); $('resTotal').textContent = '/ ' + total;
    var pct = score / total;
    var nStars = pct >= .9 ? 3 : pct >= .6 ? 2 : pct > 0 ? 1 : 0;
    $('resBadge').innerHTML = [0, 1, 2].map(function (i) { return '<span class="big-star' + (i < nStars ? ' on' : '') + '" style="animation-delay:' + (.25 + i * .22) + 's">★</span>'; }).join('');
    if (pct >= .6) setTimeout(function () { confetti(innerWidth / 2, innerHeight * .35, 90, 2.6); }, 350);
    $('resMsg').textContent = pct === 1 ? '全部答對，太厲害了！' : pct >= .8 ? '表現很棒，再把錯的弄懂就完美了。' : pct >= .6 ? '不錯喔！看看下面的解析再挑戰一次。' : '別灰心，先看解析，再練一次會更好。';
    $('resStars').textContent = quiz.newStars ? '這次新點亮 ' + quiz.newStars + ' 顆星 ★' : '這次沒有新的星星，換個關卡試試看。';
    var wrong = quiz.results.filter(function (r) { return !r.ok; });
    $('resReview').innerHTML = wrong.length ? '<h3>答錯的題目</h3>' + wrong.map(function (r) {
      return '<div class="rv' + (window.Zhuyin && window.Zhuyin.revealsAnswer(r.q.q + r.q.opts.join('')) ? ' no-zy' : '') + '"><p>' + esc(r.q.q) + '</p><p class="yours">你的答案：' + esc(r.q.opts[r.pick]) + '</p><p class="ans">正確答案：' + esc(r.q.opts[r.q.ans]) + '</p><p class="hint">' + esc(r.q.ex) + '</p></div>';
    }).join('') : '';
    var last = quiz;
    $('resAgain').onclick = function () { replay(last.replay, last.label, last.subj); };
    $('resBack').onclick = function () { quiz = null; location.hash = last.subj === 'mix' ? '#home' : '#isle-' + last.subj; route(); };
    show('result');
  }
  function replay(r, label, subj) {
    var gk = profile.grade || 'g5a';
    if (r.type === 'daily') return startDaily();
    var qs = r.type === 'unit' ? shuffle(questionsOf(gk, subj, r.unit)).slice(0, 10)
      : r.type === 'wrong' ? shuffle(questionsOf(gk, subj).filter(function (q) { return profile.wrong[q.id]; })).slice(0, 15)
      : shuffle(questionsOf(gk, subj)).slice(0, 15);
    if (!qs.length) { toast('錯題都複習完了！'); location.hash = '#isle-' + subj; route(); return; }
    startQuiz({ label: label, subj: subj, qs: qs, replay: r });
  }
  function startDaily() {
    var gk = profile.grade || 'g5a', qs = [];
    SUBJECTS.forEach(function (s) {
      var pool = questionsOf(gk, s.key);
      var fresh = pool.filter(function (q) { return !profile.stars[q.id]; });
      qs = qs.concat(shuffle(fresh.length >= 2 ? fresh : pool).slice(0, 2));
    });
    startQuiz({ label: '今日航線', subj: 'mix', qs: qs, replay: { type: 'daily' } });
  }
  $('dailyBtn').onclick = startDaily;

  /* ---------- 學習紀錄 ---------- */
  function fmtTime(t) { var d = new Date(t); function p(n) { return (n < 10 ? '0' : '') + n; } return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function renderHistory() {
    var h = profile.history;
    var tq = 0, tr = 0, days = {};
    h.forEach(function (x) { tq += x.total; tr += x.score; days[new Date(x.t).toDateString()] = 1; });
    var gk = profile.grade || 'g5a', stars = 0, max = 0;
    SUBJECTS.forEach(function (s) { var c = starCount(gk, s.key); stars += c.got; max += c.max; });
    $('stats').innerHTML = [
      ['練習次數', h.length], ['作答題數', tq], ['答對率', tq ? Math.round(tr / tq * 100) + '%' : '—'], ['學習天數', Object.keys(days).length], ['本年級星星', stars + ' / ' + max]
    ].map(function (s) { return '<div class="stat"><div class="k">' + s[0] + '</div><div class="v">' + s[1] + '</div></div>'; }).join('');
    $('logBody').innerHTML = h.map(function (x) {
      var s = subjInfo(x.subj), gi = gradeInfo(x.grade);
      return '<tr><td>' + fmtTime(x.t) + '</td><td>' + (gi ? gi.short : '') + '</td><td><span class="tag" style="--c:' + (s ? s.color : 'var(--sea)') + '">' + (s ? s.name : '綜合') + '</span></td><td>' + esc(x.title) + '</td><td class="num">' + x.score + ' / ' + x.total + '</td></tr>';
    }).join('');
    $('logEmpty').hidden = h.length > 0;
    $('logBody').closest('.table-wrap').hidden = !h.length;
    show('history');
  }

  /* ---------- 路由 ---------- */
  function route() {
    renderUserChip();
    if (quiz && !$('view-quiz').hidden) return;
    var h = location.hash.replace('#', '');
    if (h.indexOf('isle-') === 0) renderSubject(h.slice(5));
    else if (h === 'history') renderHistory();
    else if (h === 'studio' && window.IslandStudio) { window.IslandStudio.render(); show('studio'); }
    else { renderHome(); show('home'); }
  }
  window.addEventListener('hashchange', function () { quiz = null; route(); });
  $('gradeChip').onclick = openGrade;
  $('userChip').onclick = openUser;

  window.IslandApp = {
    GRADES: GRADES, SUBJECTS: SUBJECTS, toast: toast, route: route, esc: esc,
    currentGrade: function () { return profile.grade || 'g5a'; },
    allSets: allSets,
    remoteSets: function () { return remoteSets; },
    localSets: function () { return custom.sets; },
    addSet: function (set) { custom.sets.push(set); saveCustom(); },
    deleteSet: function (id) { custom.sets = custom.sets.filter(function (s) { return s.id !== id; }); if (custom.deleted.indexOf(id) < 0) custom.deleted.push(id); saveCustom(); },
    importSets: function (sets) { var n = 0; sets.forEach(function (s) { if (s && s.id && s.qs) { custom.sets = custom.sets.filter(function (x) { return x.id !== s.id; }); custom.sets.push(s); custom.deleted = custom.deleted.filter(function (d) { return d !== s.id; }); n++; } }); saveCustom(); return n; },
    markPublished: function () { custom.sets = []; custom.deleted = []; saveCustom(); },
    setRemote: function (sets) { remoteSets = sets || []; }
  };
  function saveCustom() { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); } catch (e) { toast('瀏覽器空間不足，題庫沒有存成功'); } }
  // 讀取網站上已發布的 AI 題庫（GitHub Pages 上才有；直接開檔案時會略過）
  if (location.protocol.indexOf('http') === 0) {
    fetch('custom-questions.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.sets) { remoteSets = d.sets; if (!quiz) route(); } }).catch(function () {});
  }

  route();
  initFirebase();
  if (!profile.grade) setTimeout(openGrade, 300);
})();

</script>
